name: gen-types

# 発火条件:
#   - 任意ブランチへの push かつ supabase/migrations/ または supabase/config.toml が変更された場合
#   - workflow_dispatch (手動 trigger)
#
# 目的:
#   migration ファイルからローカル supabase スタックを建て、生成型 app/types/supabase.ts を再生成して
#   同じブランチに commit-back する。これにより:
#     - 開発者はローカルで pnpm db:types を手動実行しなくてよい (secret 不要)
#     - feature ブランチでも (remote dev 適用前でも) migration ファイル基準で正しい型が得られる
#       = remote dev DB ではなくローカルスタックを真実のソースにするため、どのブランチでも成立する
#   remote dev DB への適用は別ワークフロー (migrate-dev.yml) の責務。本ワークフローは型生成のみ。
#
# ループ防止:
#   commit-back は GITHUB_TOKEN で push する。GITHUB_TOKEN による push は新たな workflow を
#   トリガしないため無限ループしない。

on:
  push:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/gen-types.yml'
  workflow_dispatch: {}

# 同一ブランチの連続実行を抑止 (commit-back のレース防止)
concurrency:
  group: gen-types-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gen-types:
    runs-on: ubuntu-latest

    # commit-back のため書き込み権限を付与
    permissions:
      contents: write

    steps:
      - name: Checkout (push 先ブランチを取得)
        uses: actions/checkout@v6
        with:
          # detached HEAD を避け、commit-back できるよう対象ブランチを明示
          ref: ${{ github.ref_name }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # latest 追従は禁止。v2.106.0 で gen types が TS シェルへ移植され
          # --local でも access token を要求するリグレッションが入ったため、
          # 既知正常な v2.105.0 に固定する (全ワークフローで統一)。
          version: 2.105.0

      - name: Start local Supabase stack (migrations 自動適用)
        # 型生成に不要な重いサービスは除外して起動を高速化 (db + auth schema は維持)
        run: |
          supabase start \
            -x studio,realtime,storage-api,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Generate types from local DB
        run: supabase gen types typescript --local > app/types/supabase.ts

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup || true

      - name: Commit & push regenerated types (差分があれば)
        run: |
          if git diff --quiet -- app/types/supabase.ts; then
            echo "型に差分なし。commit-back をスキップします。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/types/supabase.ts
          git commit -m "chore(types): regenerate supabase types from migrations [gen-types]"
          git push origin "HEAD:${{ github.ref_name }}"
