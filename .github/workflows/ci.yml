name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ガード 1: 既存マイグレーションファイルが改変されていないか git diff (HEAD~1..HEAD) で検証
  # (pre-commit が --no-verify で skip された場合のセーフティネット)
  migration-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2   # HEAD~1 比較のため最低 2 必要

      - name: Check migration integrity
        run: ./scripts/check-migration-integrity.sh ci

  # ガード 0: GitHub Actions ワークフロー (.github/workflows/*.yml) の静的検証
  # (pre-commit が actionlint 未導入でバイパスされた場合のセーフティネット)
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error

  # ガード 2: supabase db lint で SECURITY DEFINER 関数の search_path 未固定や RLS 未設定など
  # セキュリティアンチパターンを検出 (B2 確定方針, dev プロジェクトに対して実行)
  # 必要な Environment Secrets (dev):
  #   - SUPABASE_ACCESS_TOKEN
  #   - SUPABASE_PROJECT_REF
  #   - SUPABASE_DB_PASSWORD
  db-lint:
    runs-on: ubuntu-latest
    # dependabot 起動の実行には Environment Secrets が注入されない (GitHub のセキュリティ仕様)。
    # secret 必須のため dependabot PR ではスキップし、赤化を防ぐ。
    # bump の実質検証は他ジョブ + マージ後の push (main/dev) の本ジョブで担保される。
    if: ${{ github.actor != 'dependabot[bot]' }}
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # latest 追従は禁止。v2.106.0 で gen types が TS シェルへ移植され
          # --local でも access token を要求するリグレッションが入ったため、
          # 既知正常な v2.105.0 に固定する (全ワークフローで統一)。
          version: 2.105.0

      - name: Link to dev project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Run db lint (error level)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db lint --linked --level error

  # ガード 3: 依存パッケージのサプライチェーン/既知脆弱性スキャン (継続監視)
  # 現状はビルドツール由来の既存 CVE が多く CI を赤にしないため「レポートのみ(非ブロッキング)」。
  # nuxt 更新 + トリアージ後に `pnpm audit --prod --audit-level high` へ切替えてブロッキング化する。
  # 自動アラート/更新 PR は別途 .github/dependabot.yml が担当。
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile: lockfile と package.json の不一致(改ざん含む)を検知して失敗させる
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (report only)
        run: |
          pnpm audit --audit-level low | tee audit-report.txt || true
          {
            echo "### 🔒 pnpm audit"
            echo '```'
            tail -n 25 audit-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 既存の lint / typecheck / test ジョブ
  lint-typecheck-test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: i18n key parity check
        run: pnpm run i18n:check

  # 統合テスト: dev DB に対して RLS / RPC の境界値テストを実行
  # 必要な Environment Secrets (dev):
  #   - SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY / SUPABASE_SECRET_KEY
  # 注: dev DB を共有するため並行実行を抑止 (concurrency)
  integration-test:
    runs-on: ubuntu-latest
    # dependabot 起動の実行には Environment Secrets が注入されない (GitHub のセキュリティ仕様)。
    # secret 必須のため dependabot PR ではスキップし、赤化を防ぐ。
    # bump の実質検証は他ジョブ + マージ後の push (main/dev) の本ジョブで担保される。
    if: ${{ github.actor != 'dependabot[bot]' }}
    environment: dev
    concurrency:
      group: integration-test-dev
      cancel-in-progress: false
    env:
      NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      NUXT_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm test:integration
